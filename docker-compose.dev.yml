version: '3.8'

# Development overrides - use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./src:/app/src
      - ~/.aspnet/https:/https:ro

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
